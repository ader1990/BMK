---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
spec:
  destination:
    namespace: nginx
    name: kub-poc-admin@kub-poc
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  source:
    path: config/workload/nginx
    repoURL: git@github.com:ader1990/BMK.git
    targetRevision: baremetal_virtual
