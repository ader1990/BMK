---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.openstack_memcached.name }}
spec:
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
  destination:
    namespace: {{ .Values.openstack_memcached.namespace }}
    server: https://192.168.56.151:6443
  project: default
  source:
    chart: memcached
    repoURL: https://tarballs.opendev.org/openstack/openstack-helm
    targetRevision: {{ .Values.openstack_memcached.version }}
    helm:
      valueFiles:
        - values.yaml
      values: |-
        {{- toYaml .Values.openstack_memcached.values | nindent 8 }}
